# Mingle — the one-command install (ADR-0002: one container, one SQLite volume).
#
#   docker compose up -d        # pulls the published image, starts Mingle on
#                               # http://localhost:3000 (MINGLE_PORT to change),
#                               # keeps its data in the mingle-data volume
#
# The image is ghcr.io/chicagodave/mingle, published by the tag-driven
# pipeline in .github/workflows/verify-and-publish.yml (ADR-0022). This file
# pins the minor line, so `docker compose pull && docker compose up -d` picks
# up patch releases but never a surprise minor; bump the tag below to move
# to a new minor. `latest` moves across minors and is for trying the
# product, not for running it. To build from source instead, layer
# compose.build.yaml on top (see that file).
#
# There is no database service: SQLite lives inside the app container at
# /data/mingle.db on the mounted volume, and pending migrations are applied
# every time the container starts, so upgrading is
# `docker compose pull && docker compose up -d`.
#
# Backup = copy the database file out of the volume while the app is running
# (SQLite in WAL mode stays consistent under a copy):
#   docker compose cp app:/data/mingle.db ./mingle-backup.db
# Restore = stop the app, copy it back, start the app:
#   docker compose stop app && docker compose cp ./mingle-backup.db app:/data/mingle.db && docker compose start app
# Attachments live beside it in /data/attachments — back up the whole volume
# (`docker run --rm -v mingle-ts_mingle-data:/data -v "$PWD":/backup alpine tar czf /backup/mingle-data.tgz /data`)
# to keep them too.
#
# Development stack with a local mail server: see compose.dev.yaml.
services:
  app:
    image: ghcr.io/chicagodave/mingle:1.0
    init: true
    restart: unless-stopped
    environment:
      # The absolute address people reach Mingle at — used in emails and
      # chat notifications, and as the OIDC callback origin. Set it to the
      # real hostname when the install is not on this machine.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Session cookies are only sent over HTTPS unless this is "true". A
      # plain-HTTP install on a LAN needs it; behind an HTTPS reverse proxy
      # set INSECURE_COOKIES=false (or remove it) so cookies stay Secure.
      INSECURE_COOKIES: ${INSECURE_COOKIES:-true}
      # Outbound mail for history notifications; unset = notifications
      # queue until an SMTP relay is configured (see compose.dev.yaml).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-mingle@localhost}
    ports:
      - "${MINGLE_PORT:-3000}:3000"
    volumes:
      - mingle-data:/data

volumes:
  mingle-data:
