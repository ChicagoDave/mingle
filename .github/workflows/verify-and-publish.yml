# Mingle — the standing gate in CI, and the tag-driven image publish (ADR-0022).
#
# Every push to main runs `cd mingle-ts && npm run verify` (typecheck,
# behavioral suites, production build). That run is advisory: it reports on
# the commit and in the Actions tab, and nothing requires it — the
# repository accepts no pull requests (ADR-0022 Decision 6).
#
# A version tag `v<major>.<minor>.<patch>` runs the same gate and, only if it
# passes, builds the multi-architecture production image and pushes it to
# ghcr.io/chicagodave/mingle tagged with the exact version, its minor line,
# and `latest`. Cutting a release is `git tag v1.4.2 && git push --tags`.
#
# Forks publish to their own namespace by changing IMAGE_NAME below — nothing
# else here names this repository.
name: verify-and-publish

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/chicagodave/mingle

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mingle-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mingle-ts/package-lock.json
      - run: npm ci
      - run: npm run verify

  publish:
    name: build and push the image
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Derive the version tags from the git tag
        id: version
        # v1.4.2 -> 1.4.2 and 1.4; no shell expansion beyond GitHub's own.
        run: |
          full="${GITHUB_REF_NAME#v}"
          minor="${full%.*}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mingle
            org.opencontainers.image.description=A self-hosted rewrite of ThoughtWorks Mingle — one container, one SQLite volume
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: mingle-ts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile stamps the same version label itself, so a local
          # build with this build-arg is label-identical to a published one.
          build-args: |
            MINGLE_VERSION=${{ steps.version.outputs.full }}
            MINGLE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
